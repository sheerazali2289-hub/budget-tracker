<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dynamic Budget Tracker</title>
    <link rel="stylesheet" href="style.css" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe"
      crossorigin="anonymous"
    />
    <script
      type="module"
      src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL"
      crossorigin="anonymous"
    ></script>
  </head>
  <body>
    <h1 id="heading">My Personal Budgte Hub</h1>
    <div class="container">
      <div class="card card1">
        <div class="card-body">
          <h4><b>Add Budget</b></h4>
          <h5>Budget:</h5>
          <input type="text" class="input" id="budgetInput"/>
          <button class="btnAdd" id="budgetBtn">Add Budget</button>
        </div>
      </div>

      <div class="card card2">
        <div class="card-body">
          <h4><b>Add Expense</b></h4>
          <h5>Expense Tittle:</h5>
          <input type="text" class="input"  id="expenseTitleInput"/>
          <h5>Amount:</h5>
          <input type="text" class="input" id="expenseAmountInput"/>
          <button class="btnAdd" id="expenseBtn">Add Expense</button>
        </div>
      </div>
      <div class="restBtn" id="resetBtn">Reset All</div>

      <div class="card card3">
        <div class="card-body">
          <div class="boxes">
            <div class="box box1">Total Budget: <span id="totalBudgetDisplay">$0</span></div>
            <div class="box box2">Total Expense: <span id="totalExpenseDisplay">$0</span></div>
            <div class="box box3">Budget Left: <span id="budgetLeftDisplay">$0</span></div>
          </div>
          <div class="divider"></div>
          <h5>Expense History:</h5>
          <div class="divider"></div>
           
          <div class="middle"> 
            <h5>Expense Name</h5>
            <h5>Amount</h5>
            <h5>Action</h5>
          </div>
          <div class="divider"></div>
          <ul id="historyList">
          </ul>
        </div>
      </div>
    </div>
  </body>
  <script src="index.js"></script>
</html>
